# Rebuilds data/catalog.json (the list the "自己疊疊看" page reads)
# whenever a perfume file is added or changed.
name: 更新香水清單
on:
  push:
    branches: [main]
    paths: ["data/perfumes/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-catalog.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet data/catalog.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "更新香水清單"
          git push
