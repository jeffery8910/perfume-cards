# Exports every card as a 1080×1350 PNG whenever cards or data change.
# Download them from the run page: Actions → 匯出 IG 圖片 → Artifacts.
name: 匯出 IG 圖片
on:
  push:
    branches: [main]
    paths: ["data/**", "img/**", "assets/**", "deck.html", "scripts/**"]
  workflow_dispatch:
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: 安裝中文字型
        run: sudo apt-get install -y fonts-noto-cjk
      - name: 檢查照片連結
        run: node scripts/check-photos.mjs
        continue-on-error: true
      - run: npm run shots
      - uses: actions/upload-artifact@v4
        with:
          name: ig-cards
          path: shots/
          retention-days: 30
